name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Create project files
        run: |
          mkdir -p app/src/main/java/com/autoreply/bot app/src/main/res/xml app/src/main/res/values
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "AutoReply"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=false
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.autoreply.bot"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.autoreply.bot"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
              <application
                  android:label="رد تلقائي"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".KeepAliveService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="auto_reply" />
                  </service>
                  <receiver android:name=".BootReceiver" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                      </intent-filter>
                  </receiver>
                  <service
                      android:name=".AccService"
                      android:exported="true"
                      android:label="رد تلقائي"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>
                  <service
                      android:name=".ReplyService"
                      android:exported="true"
                      android:label="رد تلقائي"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/autoreply/bot/ReplyService.kt <<'EOF'
          package com.autoreply.bot

          import android.app.Notification
          import android.app.RemoteInput
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.os.Bundle
          import android.service.notification.NotificationListenerService
          import android.service.notification.StatusBarNotification

          // كل سطر = رد. الرد الأخير بيتكرر لباقي الرسايل.
          val DEFAULT_REPLIES = listOf(
              "أهلاً، لقد وصلتني رسالتك وسوف أرد عليك في أقرب وقت.",
              "أهلاً، لقد وصلتني رسالتك وسوف أرد عليك في أقرب وقت.",
              "خلاص قلنا الرسالة وصلت، هنرد في أقرب وقت.",
              "يلعن أبو الشغلانة دي، ما كان زماني في مكتب بدل ما أنا عمال أرد على الرسائل، مش عارف أنا عملت إيه وحش في حياتي."
          ).joinToString("\n")

          object Replier {
              private val pkgs = setOf("com.whatsapp", "com.whatsapp.w4b")

              fun handle(ctx: Context, pkg: String, n: Notification, postTime: Long) {
                  val p = ctx.getSharedPreferences("cfg", Context.MODE_PRIVATE)
                  if (!p.getBoolean("on", true)) return
                  if (pkg !in pkgs) return
                  if (n.flags and Notification.FLAG_GROUP_SUMMARY != 0) return
                  val ex = n.extras ?: return
                  if (ex.getBoolean("android.isGroupConversation", false)) return
                  val sender = ex.getCharSequence("android.title")?.toString() ?: return
                  val text = ex.getCharSequence("android.text")?.toString() ?: return
                  val action = n.actions?.firstOrNull { it.remoteInputs?.isNotEmpty() == true } ?: return

                  val replies = (p.getString("replies", DEFAULT_REPLIES) ?: DEFAULT_REPLIES)
                      .lines().map { it.trim() }.filter { it.isNotEmpty() }
                  if (replies.isEmpty()) return
                  if (replies.any { text.contains(it) }) return

                  val time = if (n.`when` > 0) n.`when` else postTime
                  if (time <= p.getLong("last_$sender", 0L)) return

                  val count = p.getInt("c_$sender", 0) + 1
                  p.edit().putInt("c_$sender", count).putLong("last_$sender", time).apply()
                  val reply = replies[minOf(count, replies.size) - 1]

                  val ris = action.remoteInputs
                  val intent = Intent()
                  val bundle = Bundle()
                  ris.forEach { bundle.putCharSequence(it.resultKey, reply) }
                  RemoteInput.addResultsToIntent(ris, intent, bundle)
                  try {
                      action.actionIntent.send(ctx, 0, intent)
                  } catch (e: Exception) {
                  }
              }
          }

          class ReplyService : NotificationListenerService() {
              override fun onListenerDisconnected() {
                  requestRebind(ComponentName(this, ReplyService::class.java))
              }

              override fun onNotificationPosted(sbn: StatusBarNotification) {
                  Replier.handle(this, sbn.packageName, sbn.notification, sbn.postTime)
              }
          }
          EOF
          cat > app/src/main/java/com/autoreply/bot/AccService.kt <<'EOF'
          package com.autoreply.bot

          import android.accessibilityservice.AccessibilityService
          import android.app.Notification
          import android.view.accessibility.AccessibilityEvent

          class AccService : AccessibilityService() {
              override fun onAccessibilityEvent(event: AccessibilityEvent) {
                  if (event.eventType != AccessibilityEvent.TYPE_NOTIFICATION_STATE_CHANGED) return
                  val n = event.parcelableData as? Notification ?: return
                  val pkg = event.packageName?.toString() ?: return
                  Replier.handle(this, pkg, n, System.currentTimeMillis())
              }

              override fun onInterrupt() {}
          }
          EOF
          cat > app/src/main/res/xml/accessibility_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeNotificationStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:notificationTimeout="100"
              android:packageNames="com.whatsapp,com.whatsapp.w4b"
              android:description="@string/acc_desc" />
          EOF
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="acc_desc">بتقرا إشعارات واتساب عشان ترد عليها تلقائياً. مبتقراش أي حاجة تانية.</string>
          </resources>
          EOF
          cat > app/src/main/java/com/autoreply/bot/KeepAliveService.kt <<'EOF'
          package com.autoreply.bot

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.os.Build
          import android.os.IBinder

          class KeepAliveService : Service() {
              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(
                      NotificationChannel("keep", "تشغيل في الخلفية", NotificationManager.IMPORTANCE_MIN)
                  )
                  val n = Notification.Builder(this, "keep")
                      .setSmallIcon(android.R.drawable.ic_dialog_info)
                      .setContentTitle("الرد التلقائي شغال")
                      .setOngoing(true)
                      .build()
                  if (Build.VERSION.SDK_INT >= 34) {
                      startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE)
                  } else {
                      startForeground(1, n)
                  }
                  return START_STICKY
              }
          }

          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  val on = context.getSharedPreferences("cfg", Context.MODE_PRIVATE).getBoolean("on", true)
                  if (on) context.startForegroundService(Intent(context, KeepAliveService::class.java))
              }
          }
          EOF
          cat > app/src/main/java/com/autoreply/bot/MainActivity.kt <<'EOF'
          package com.autoreply.bot

          import android.app.Activity
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.view.View
          import android.widget.*

          class MainActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val p = getSharedPreferences("cfg", MODE_PRIVATE)
                  val pad = (16 * resources.displayMetrics.density).toInt()

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(pad, pad, pad, pad)
                      layoutDirection = View.LAYOUT_DIRECTION_RTL
                  }
                  fun label(t: String) = TextView(this).apply {
                      text = t
                      textSize = 16f
                      textDirection = View.TEXT_DIRECTION_RTL
                      setPadding(0, pad / 2, 0, pad / 4)
                  }
                  fun button(t: String, f: () -> Unit) = Button(this).apply {
                      text = t
                      setOnClickListener { f() }
                  }

                  val sw = Switch(this).apply {
                      text = "تفعيل الرد التلقائي"
                      textSize = 18f
                      isChecked = p.getBoolean("on", true)
                      setOnCheckedChangeListener { _, c ->
                          p.edit().putBoolean("on", c).apply()
                          keepAlive(c)
                      }
                  }
                  val et = EditText(this).apply {
                      setText(p.getString("replies", DEFAULT_REPLIES))
                      minLines = 8
                      gravity = Gravity.TOP
                      textDirection = View.TEXT_DIRECTION_RTL
                  }

                  root.addView(label("رد تلقائي على واتساب"))
                  root.addView(sw)
                  root.addView(label("الردود (كل سطر = رد). أول رسالة من الشخص ياخد السطر الأول، والتانية التاني، وهكذا. السطر الأخير بيتكرر."))
                  root.addView(et)
                  root.addView(button("حفظ الردود") {
                      p.edit().putString("replies", et.text.toString()).apply()
                      Toast.makeText(this, "اتحفظت", Toast.LENGTH_SHORT).show()
                  })
                  root.addView(button("1) تفعيل خدمة إمكانية الوصول (الأنسب لإنفينكس)") {
                      try {
                          startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                      } catch (e: Exception) {
                          Toast.makeText(this, "الشاشة دي مش متاحة في موبايلك", Toast.LENGTH_LONG).show()
                      }
                  })
                  root.addView(button("1-ب) إذن الوصول للإشعارات (لو موبايلك يدعمه)") {
                      try {
                          startActivity(Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS))
                      } catch (e: Exception) {
                          Toast.makeText(this, "الشاشة دي مش متاحة في موبايلك", Toast.LENGTH_LONG).show()
                      }
                  })
                  root.addView(button("2) السماح بالإشعارات (عشان يفضل شغال 24 ساعة)") {
                      if (Build.VERSION.SDK_INT >= 33) {
                          requestPermissions(arrayOf("android.permission.POST_NOTIFICATIONS"), 1)
                      }
                  })
                  root.addView(button("3) استثناء من توفير البطارية") {
                      try {
                          startActivity(
                              Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS, Uri.parse("package:$packageName"))
                          )
                      } catch (e: Exception) {
                          startActivity(Intent(Settings.ACTION_IGNORE_BATTERY_OPTIMIZATION_SETTINGS))
                      }
                  })
                  root.addView(button("تصفير العدّاد (يبدأ من أول رد لكل شخص)") {
                      val e = p.edit()
                      p.all.keys.filter { it.startsWith("c_") || it.startsWith("last_") }.forEach { e.remove(it) }
                      e.apply()
                      Toast.makeText(this, "اتصفّر", Toast.LENGTH_SHORT).show()
                  })
                  setContentView(ScrollView(this).apply { addView(root) })
                  keepAlive(p.getBoolean("on", true))
              }

              private fun keepAlive(start: Boolean) {
                  val i = Intent(this, KeepAliveService::class.java)
                  try {
                      if (start) startForegroundService(i) else stopService(i)
                  } catch (e: Exception) {
                  }
              }
          }
          EOF
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: AutoReply-APK
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk AutoReply.apk
          gh release create "v${{ github.run_number }}" AutoReply.apk --title "AutoReply v${{ github.run_number }}" --notes "APK جاهز للتحميل والتثبيت"
